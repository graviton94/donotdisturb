<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Do Not Disturb!</title>
<link rel="stylesheet" href="fonts/black-han-sans/index.css">
<link rel="stylesheet" href="fonts/pretendard/index.css">
<style>
/* ---- boot: loading (real progress) → title (tap to start). Art: img/title/* (commission), code fallbacks until delivered ---- */
#boot{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;color:#fff;font-family:"Pretendard",system-ui,sans-serif;
 background:radial-gradient(120% 80% at 50% 10%,#FF8A2A 0%,#C2410C 30%,#3B1406 70%,#140806 100%);transition:opacity .45s ease}
#boot.gone{opacity:0;pointer-events:none}
#boot .bg{position:absolute;inset:0;background:center/cover no-repeat}
#boot .rays{position:absolute;left:50%;top:34%;width:1400px;height:1400px;margin:-700px 0 0 -700px;background:repeating-conic-gradient(from 0deg,rgba(255,240,200,.12) 0 8deg,transparent 8deg 20deg);-webkit-mask:radial-gradient(closest-side,#000 15%,transparent 75%);mask:radial-gradient(closest-side,#000 15%,transparent 75%);animation:bootspin 30s linear infinite}
#boot .pills{position:absolute;inset:0;pointer-events:none}
#boot .pill{position:absolute;display:flex;align-items:center;gap:8px;padding:9px 13px 9px 9px;border-radius:16px;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25);font:700 12px/1.2 "Pretendard";color:#fff;white-space:nowrap;animation:bootfloat 7s ease-in-out infinite}
#boot .pill i{width:22px;height:22px;border-radius:7px;flex:none}
#boot .logo{position:relative;z-index:2;text-align:center;transform:translateY(-6vh)}
#boot .logo img{width:min(86vw,520px);height:auto;display:block;filter:drop-shadow(0 10px 0 rgba(40,12,2,.55))}
#boot .logo .lt{font:400 clamp(56px,16vw,92px)/.95 "Black Han Sans","Pretendard",sans-serif;color:#FFE34D;-webkit-text-stroke:9px #2A0F04;paint-order:stroke fill;text-shadow:0 10px 0 #2A0F04;letter-spacing:-.01em}
#boot .logo .ls{margin-top:14px;font:800 15px/1.2 "Pretendard";letter-spacing:.18em;text-transform:uppercase;color:#FFE9C8;text-shadow:0 2px 6px rgba(0,0,0,.5)}
#boot .mascot{position:relative;z-index:2;width:120px;height:120px;margin-top:-2vh;object-fit:contain;animation:bootbob 1.6s ease-in-out infinite}
#boot .load{position:absolute;left:12%;right:12%;bottom:13vh;z-index:2;text-align:center}
#boot .bar{height:10px;border-radius:99px;background:rgba(0,0,0,.35);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
#boot .bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#FFD23F,#FF8A1F);box-shadow:0 0 12px rgba(255,200,60,.8);transition:width .25s ease}
#boot .lk{display:flex;justify-content:space-between;margin-top:8px;font:700 12px "Pretendard";color:#FFE0BF}
#boot .tip{margin-top:18px;min-height:2.6em;font:600 13.5px/1.35 "Pretendard";color:#FFF3E2;opacity:.92}
#boot .start{position:absolute;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));z-index:2;display:none;padding:0 18px}
#boot .panel{max-width:400px;margin:0 auto;padding:18px 16px 12px;border-radius:26px;background:rgba(20,10,6,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18);box-shadow:0 18px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:10px}
#boot .panel .opt{width:100%;height:54px;border-radius:16px;border:0;display:flex;align-items:center;justify-content:center;gap:10px;font:800 16px/1 "Pretendard";cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .08s}
#boot .panel .opt:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
#boot .panel .opt svg{width:20px;height:20px;margin:0!important}
#boot .panel .go{background:linear-gradient(#FFE27A,#F0A000);color:#2A1800;font-size:18px;font-weight:900;animation:bootpulse 1.6s ease-in-out infinite}
#boot .panel .g{background:#fff;color:#1F1F1F}#boot .panel .k{background:#FEE500;color:rgba(0,0,0,.85)}
#boot .panel .or{display:flex;align-items:center;gap:10px;font:700 11.5px "Pretendard";color:rgba(255,235,210,.75)}#boot .panel .or::before,#boot .panel .or::after{content:"";flex:1;height:1px;background:rgba(255,235,210,.25)}
#boot .panel .note{font:600 11.5px/1.45 "Pretendard";color:rgba(255,235,210,.8);text-align:center;margin:0}
#boot .panel .bfoot{position:static;font:600 11px "Pretendard";color:rgba(255,235,210,.6);text-align:center}
#boot.title .load{display:none}#boot.title .start{display:block}

#boot .bfoot{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));z-index:2;text-align:center;font:600 11px "Pretendard";color:rgba(255,235,210,.7)}#boot.title>.bfoot{display:none}
#boot .bfoot a{color:inherit;display:inline;text-decoration:underline}
#boot.art .rays,#boot.art .pills{display:none}
#boot.art .logo{position:absolute;top:calc(7vh + env(safe-area-inset-top));left:0;right:0;transform:none;display:flex;flex-direction:column;align-items:center}
#boot.art .logo img{width:min(84vw,460px)}#boot.art .logo .ls{display:none}
#boot .stk{position:absolute;z-index:1;width:72px;height:72px;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35));animation:bootfloat 5s ease-in-out infinite}
#boot.title .mascot{display:none!important}#boot.art .mascot{position:absolute;bottom:calc(13vh + 70px);width:104px;height:104px}
@keyframes bootspin{to{transform:rotate(360deg)}}@keyframes bootfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes bootbob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}@keyframes bootpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media (prefers-reduced-motion: reduce){#boot *{animation:none!important}}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
#stage-ui{position:fixed;inset:0;width:100vw;height:100vh;display:block;pointer-events:none}

/* ---- pull-down shade + sheets (screens-v1 Shade · Shop · Upgrade · Deck · Reset, dark) ---- */
:root{color-scheme:dark;--bg:#0D0907;--ink:#F6F1EA;--sub:#B3A89B;--line:#FFFFFF1A;--card:#FFFFFF14;--soft:#FFFFFF14;--soft2:#FFFFFF1F;--dash:#FFFFFF33;
 --sheet:#17120E;--shade:linear-gradient(180deg,#2A2119f2,#15120Ff7);--acc:#EFA03F;--on-acc:#1E1408;--acc2:#F6C453;--gold:#FFD66B;--hot:#FFB060;
 --dis:#FFFFFF14;--dis-ink:#FFFFFF66;--pack:linear-gradient(180deg,#3A2A1C,#21170F);--hero:radial-gradient(circle at 50% 0,#EFA03F33,#FFFFFF0d);
 --bigday:linear-gradient(90deg,#4A3212,#2A1C0E);--ok:#5BD68A;--ok-bg:#5BD68A24;--bad:#FF6B5A;--grab:#F6F1EA88}
/* light theme = screens-v1 Main · Shop (white cards, blue accent) */
@media (prefers-color-scheme: light){:root{color-scheme:light;--bg:#EEF1F7;--ink:#16181D;--sub:#5F6674;--line:#E6EAF2;--card:#FFFFFF;--soft:#1E2A5012;--soft2:#1E2A501C;--dash:#1E2A5033;
 --sheet:#F4F6FB;--shade:linear-gradient(180deg,#FFFFFFf4,#EEF1F7f8);--acc:#3867F0;--on-acc:#FFFFFF;--acc2:#B25F00;--gold:#C07A00;--hot:#C05A00;
 --dis:#1E2A5014;--dis-ink:#8A90A0;--pack:linear-gradient(180deg,#FFFFFF,#EEF2FA);--hero:radial-gradient(circle at 50% 0,#3867F022,#FFFFFF);
 --bigday:linear-gradient(90deg,#FFF1CF,#FFE3A6);--ok:#0E7A3E;--ok-bg:#18A95724;--bad:#D81E2A;--grab:#16181D55}}
.ov{position:fixed;inset:0;color:var(--ink);font:14px/1.4 "Pretendard","Noto Sans KR",system-ui,sans-serif;pointer-events:none}
.ov.open{pointer-events:auto}
#scrim{position:fixed;inset:0;background:#000a;opacity:0;transition:opacity .22s;pointer-events:none}
#scrim.open{opacity:1;pointer-events:auto}
#shade{position:fixed;left:0;right:0;top:0;max-height:92vh;color:var(--ink);font:14px/1.4 "Pretendard","Noto Sans KR",system-ui,sans-serif;overflow:auto;padding:18px 16px 14px;border-radius:0 0 28px 28px;
 background:var(--shade);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 50px #000c;
 transform:translateY(-104%);transition:transform .32s cubic-bezier(.2,1,.3,1)}
#shade.open{transform:none}
.sh-top{display:flex;align-items:baseline;justify-content:space-between}
.sh-act{display:flex;align-items:center;gap:8px}.sh-act .chip{height:40px;border-radius:12px}.sh-act #gear{width:40px;height:40px;border-radius:12px;border:1px solid var(--m-outline-v)}.sh-act #gear svg{width:20px;height:20px;stroke-width:1.8}
.sh-wallet{font:800 30px/1.15 "Pretendard",sans-serif;letter-spacing:-.02em;letter-spacing:-.01em}
.sh-wallet small{font-size:18px;color:var(--acc2)}
.lv{display:flex;align-items:center;gap:8px;margin:8px 0 2px;font-size:12px;color:var(--sub)}
.lv b{background:var(--acc);color:var(--on-acc);border-radius:999px;padding:1px 8px;font-size:12px}
.bar{flex:1;height:8px;border-radius:999px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#F6C453,#FFD66B)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px;margin:16px 0 8px}
.tile{background:none;border:0;color:inherit;font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0}
.tile span.c{width:56px;height:56px;border-radius:999px;display:grid;place-items:center;background:var(--soft2)}
.tile.hot span.c{background:var(--acc);color:var(--on-acc);box-shadow:0 6px 16px #00000030}
.tile.lock{opacity:.45}
.tile b{font-size:12.5px;font-weight:700}.tile em{font-style:normal;font-size:11px;color:var(--sub);margin-top:-3px}
.row2{display:flex;align-items:center;gap:10px;margin:10px 2px}.row2 label{font-size:12px;color:var(--sub);width:48px}
.row2 input{flex:1;accent-color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{background:var(--soft);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}
.grab{width:44px;height:5px;border-radius:9px;background:var(--grab);margin:12px auto 0}
#sheet{position:fixed;left:0;right:0;bottom:0;height:88vh;display:flex;flex-direction:column;background:var(--sheet);color:var(--ink);font:14px/1.4 "Pretendard","Noto Sans KR",system-ui,sans-serif;border-radius:26px 26px 0 0;
 box-shadow:0 -14px 40px #000c;transform:translateY(104%);transition:transform .3s cubic-bezier(.2,1,.3,1)}
#sheet.open{transform:none}
.sheet-h{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
.sheet-h h2{flex:1;margin:0;font:800 22px/1.15 "Pretendard",sans-serif;letter-spacing:-.02em}
.sheet-h .w{font-weight:800;color:var(--acc2)}
.x{background:var(--soft2);border:0;color:var(--ink);width:36px;height:36px;border-radius:999px;font-size:18px}
.sheet-b{flex:1;overflow:auto;padding:4px 14px 30px}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.seg button{flex:none;height:32px;padding:0 12px;border-radius:999px;border:0;font:inherit;font-size:12.5px;font-weight:700;background:var(--soft);color:var(--ink)}
.seg button.on{background:var(--acc);color:var(--on-acc)}
.it{min-height:66px;padding:10px 12px;border-radius:20px;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.it.lock{background:var(--soft)}.it.lock img{filter:grayscale(1);opacity:.5}
.it img{width:40px;height:40px;border-radius:11px;flex:none}
.fr{position:relative;flex:none;width:58px;height:58px;margin:-9px -7px}
.fr img{position:absolute;margin:0}.fr img.ring{inset:0;width:100%;height:100%;border-radius:0;z-index:1}
.slot .fr{width:52px;height:52px;margin:-6px 0 -8px}
.it .t{flex:1;min-width:0}.it .t .m.wrap{white-space:normal;overflow:visible;line-height:1.35}.it .t b{font-size:14.5px}.it .t .m{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tier{display:inline-block;margin-left:6px;font-size:11px;font-weight:800;color:var(--acc2)}
.btn{flex:none;min-width:88px;height:40px;padding:0 12px;border-radius:999px;border:0;font:inherit;font-size:12.5px;font-weight:800;background:var(--acc);color:var(--on-acc)}
.btn:disabled{background:var(--dis);color:var(--dis-ink)}.btn.own{background:var(--ok-bg);color:var(--ok)}
.btn.big{width:100%;height:52px;font-size:16px;margin:6px 0 12px}
.prog{height:6px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:5px}.prog i{display:block;height:100%;border-radius:999px;background:#3867F0}.prog i.hot{background:#FF8A1F}
.note{font-size:11.5px;color:var(--sub)}.note.hot{color:var(--hot);font-weight:700}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.slot{height:84px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--card);border:1px solid var(--line);font-size:11.5px;font-weight:700;color:inherit;font-family:inherit}
.slot img{width:36px;height:36px;border-radius:10px}.slot.empty{background:transparent;border:1.5px dashed var(--dash);color:var(--sub)}
.syn{display:grid;grid-template-columns:96px 1fr 58px;align-items:center;gap:8px;font-size:12.5px;margin:6px 0}.syn .v{text-align:right;font-weight:800;color:var(--acc2)}
.hero{text-align:center;padding:14px;border-radius:22px;background:var(--hero);margin-bottom:12px}
.hero b{display:block;font:800 44px/1.15 "Pretendard",sans-serif;letter-spacing:-.02em;color:var(--gold)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.cols div{background:var(--card);border-radius:16px;padding:10px 12px;font-size:12.5px}
.cols h4{margin:0 0 4px;font-size:12px;color:var(--sub)}
.h3{font-size:12.5px;color:var(--sub);margin:14px 2px 8px;font-weight:700}
.cur{display:flex;gap:6px;flex-wrap:wrap}.cur span{display:flex;align-items:center;gap:4px;background:var(--soft);border-radius:999px;padding:3px 10px 3px 4px;font-weight:800;font-size:13px}.cur img{width:22px;height:22px}
.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px;margin-bottom:10px;padding-top:14px}
.pack.rec{border:2px solid #FFC23D;box-shadow:0 0 0 3px #FFC23D33}
.pack .ros{position:absolute;right:-6px;top:18px;width:40px;height:48px;background:url(img/ui/rosette.webp) center/contain no-repeat;color:#5A2A00;font-size:10.5px;font-weight:900;line-height:36px;text-align:center;transform:rotate(12deg);z-index:2}
.pack .base{font-size:10.5px;color:var(--sub);margin:-4px 0 4px;white-space:nowrap}
.gain{display:inline-block;font-size:12px;font-weight:900;color:#fff;background:linear-gradient(180deg,#FF5A4E,#E0261C);border-radius:999px;padding:2px 9px;margin-bottom:6px;box-shadow:0 2px 0 #8A1010}
.gain.base0{background:var(--soft);color:var(--sub);box-shadow:none}
.rookie{position:relative;border-radius:20px;padding:14px 14px 12px;margin-bottom:12px;color:#fff;background:linear-gradient(135deg,#0E7A5A,#0B4A64);border:2px solid #5BD6A8;overflow:hidden}
.rookie h3{margin:0;font:800 22px/1.15 "Pretendard",sans-serif;letter-spacing:-.02em}
.rookie ul{margin:6px 0 10px;padding-left:16px;padding-right:96px;font-size:12.5px}
.rookie .rk-art{position:absolute;right:6px;bottom:50px;width:100px;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));pointer-events:none}
.rookie .d{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;background:#00000033;border-radius:999px;padding:2px 9px}
.rookie .d img{width:16px;height:16px}
.bst{position:absolute;right:8px;top:8px;width:84px;height:84px;background:url(img/ui/burst.webp) center/contain no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:#B31A00;font:900 18px/1 "Pretendard","Noto Sans KR",system-ui,sans-serif;transform:rotate(10deg);letter-spacing:-.5px}
.bst small{font-size:11px;line-height:1.1}
.rookie .btn,.starter .btn{min-width:130px}
.pack{position:relative;border-radius:18px;padding:22px 6px 8px;text-align:center;background:var(--pack);border:1px solid var(--line);color:inherit;font:inherit}
.pack img{width:64px;height:64px;object-fit:contain}.pack .n{font-weight:900;font-size:15px;margin:2px 0 6px}
.pack .won{display:block;height:36px;line-height:32px;font-weight:900;font-size:13.5px}
.pack .basep{display:block;height:18px;font-size:11px;color:var(--sub);margin:-2px 0 4px;white-space:nowrap}
.rib{position:absolute;top:-1px;left:50%;transform:translateX(-50%);background:#FF3B30;color:#fff;font-size:10.5px;font-weight:900;padding:2px 8px;border-radius:0 0 9px 9px;white-space:nowrap}
.starter{display:flex;gap:10px;align-items:center;border-radius:18px;padding:12px;background:linear-gradient(90deg,#5A1E2E,#3A1A12);border:1px solid #FF8A6B55;margin-bottom:6px;color:#FFF4EC;font:inherit;text-align:left;width:100%}
.starter img{width:64px;height:64px}.starter .note{color:#FFD9CC}.starter b{font:800 clamp(16px,5vw,20px)/1.15 "Pretendard",sans-serif;letter-spacing:-.02em;white-space:normal;display:block}
.dbtn{flex:none;min-width:70px;height:38px;border-radius:12px;border:0;font:inherit;font-weight:900;background:linear-gradient(180deg,#9BE37A,#4FB43A);color:#123006;display:flex;align-items:center;justify-content:center;gap:4px}
.dbtn img{width:18px;height:18px}
.adbtn{background:linear-gradient(180deg,#7CC4FF,#2F7BF5);color:#fff}
.passc{border-radius:20px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;border:1px solid #FFFFFF22;color:#F6F1EA}
.passc .btn{background:#FFD66B;color:#1E1408}
.passc .big{font:800 34px/1.15 "Pretendard",sans-serif;letter-spacing:-.02em;color:#fff;width:74px;text-align:center}.passc img{width:74px}
.passc{position:relative;flex-direction:column;align-items:stretch}.passc .pc-top{display:flex;gap:12px;align-items:center}
/* pass cards by tier: Monthly warm gold · Turbo electric blue with racing stripes · Ultra obsidian with a holo gold rim */
.pz{position:relative;isolation:isolate;border-radius:24px;padding:18px 16px 14px;margin:18px 0 14px;color:#F6F1EA;overflow:visible}
.pz::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1}

.pz-band img{width:16px;height:16px}
.pz-on{position:absolute;right:14px;top:-10px;font:800 11px/1 "Pretendard";padding:5px 9px;border-radius:99px;background:#34C759;color:#fff;z-index:2}
.pz-head{display:flex;gap:10px;align-items:center}.pz-txt{flex:1;min-width:0}
.pz-name{font:900 24px/1.1 "Pretendard";letter-spacing:-.03em}

.pz-x{display:inline-flex;align-items:baseline;gap:6px;margin-top:10px;padding:6px 12px 7px;border-radius:12px;transform:rotate(-2deg)}
.pz-x b{font:900 22px/1 "Pretendard";letter-spacing:-.02em}.pz-x span{font:800 12px/1 "Pretendard"}
.pz-art{position:relative;width:120px;height:120px;flex:none;display:grid;place-items:center;margin:-8px -4px -6px 0}
.pz-art img{width:120px;height:120px;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45));position:relative}
.pz-big{position:absolute;right:-6px;bottom:-4px;z-index:2;font:900 28px/1 "Pretendard";letter-spacing:-.04em;-webkit-text-stroke:5px #07050A;paint-order:stroke fill}
.pz-perks{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.pz-perks div{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:12px;background:rgba(255,255,255,.08);font:700 12px/1.25 "Pretendard"}

/* ==== Material 3 controls: the game imitates an Android phone, so every control looks like the system's own ====
   Tokens follow the system theme (dark = amber seed #EFA03F, light = blue seed #3867F0). Item art and promo stickers keep
   their illustrated style; only buttons, chips, segmented buttons, badges, dialogs, switches and sheets are M3. */
:root{--m-primary:#FFB86C;--m-on-primary:#4A2800;--m-primary-c:#6A3B00;--m-on-primary-c:#FFDCBC;
 --m-sec-c:#5A4330;--m-on-sec-c:#FDDDC5;--m-ter:#8FD694;--m-on-ter:#003910;--m-ter-c:#0F5223;--m-on-ter-c:#AAF2AE;
 --m-info:#A8C8FF;--m-on-info:#002F65;
 --m-surface:#19120C;--m-s-low:#221A13;--m-s:#261E17;--m-s-high:#31281F;--m-s-highest:#3C3229;
 --m-on-surface:#EEE0D6;--m-on-sv:#D6C3B4;--m-outline:#9F8D80;--m-outline-v:#51443A;--m-error:#FFB4AB;--m-on-error:#690005;--m-badge:#F2B8B5;--m-on-badge:#601410;
 --font:"Pretendard",Roboto,"Noto Sans KR",system-ui,sans-serif}
@media (prefers-color-scheme: light){:root{--m-primary:#2F5BD3;--m-on-primary:#FFFFFF;--m-primary-c:#DCE1FF;--m-on-primary-c:#00174B;
 --m-sec-c:#DDE1F9;--m-on-sec-c:#161B2C;--m-ter:#1E7A34;--m-on-ter:#FFFFFF;--m-ter-c:#A6F5AE;--m-on-ter-c:#00210A;
 --m-info:#0B61A4;--m-on-info:#FFFFFF;
 --m-surface:#FBF8FF;--m-s-low:#F5F2FA;--m-s:#EFEDF4;--m-s-high:#E9E7EF;--m-s-highest:#E3E1E9;
 --m-on-surface:#1A1B21;--m-on-sv:#45464F;--m-outline:#757680;--m-outline-v:#C5C6D0;--m-error:#BA1A1A;--m-on-error:#FFFFFF;--m-badge:#B3261E;--m-on-badge:#FFFFFF}}
:root{--acc:var(--m-primary);--on-acc:var(--m-on-primary);--ink:var(--m-on-surface);--sub:var(--m-on-sv);--line:var(--m-outline-v);
 --card:var(--m-s);--soft:var(--m-s-high);--soft2:var(--m-s-highest);--sheet:var(--m-s-low);--dis:color-mix(in srgb,var(--m-on-surface) 12%,transparent);
 --dis-ink:color-mix(in srgb,var(--m-on-surface) 38%,transparent)}
#sheet,#shade,#cf{font-family:var(--font)}
/* buttons: filled (P · ₩), tertiary green (데이터), info blue (광고), full-width filled (받기·모두 강화), disabled per M3 */
.btn,.dbtn,.won{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;
 min-width:72px;height:40px;padding:0 20px;border:0;border-radius:20px;font:500 14px/1 var(--font);letter-spacing:.1px;
 background:var(--m-primary);color:var(--m-on-primary);text-shadow:none;box-shadow:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dbtn,.skin.green{background:var(--m-ter);color:var(--m-on-ter)}
.skin.blue{background:var(--m-info);color:var(--m-on-info)}
.btn.big,.skin.claim{width:100%;height:56px;border-radius:16px;font-size:16px;margin:8px 0 12px}
.btn:disabled,.dbtn:disabled,.skin.off{background:var(--dis);color:var(--dis-ink);filter:none;opacity:1;cursor:default}
.btn.own{background:var(--m-sec-c);color:var(--m-on-sec-c)}
.btn img,.dbtn img{width:18px;height:18px;border-radius:0}
.pack .won{display:flex;width:100%;height:36px;min-width:0;padding:0 8px;font-size:13px;line-height:1}
/* state layer + ripple */
.btn::before,.dbtn::before,.won::before,.x::before,.seg button::before,.chip::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .15s;pointer-events:none;border-radius:inherit}
.btn:active::before,.dbtn:active::before,.won:active::before,.x:active::before,.seg button:active::before{opacity:.12}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);animation:rip .45s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
/* icon button (close) */
.x{position:relative;overflow:hidden;width:40px;height:40px;border:0;border-radius:20px;background:transparent;color:var(--m-on-sv);font:400 22px/1 var(--font);display:grid;place-items:center}
/* filter chips (tiers) and segmented buttons (×1 · ×10 · Max) */
.seg{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.seg button{position:relative;overflow:hidden;flex:none;height:32px;padding:0 16px;border-radius:8px;border:1px solid var(--m-outline);background:transparent;color:var(--m-on-sv);font:500 14px/1 var(--font)}
.seg button.on{background:var(--m-sec-c);color:var(--m-on-sec-c);border-color:transparent;padding-left:10px}
.seg button.on::after{content:"✓";margin-left:-2px;order:-1}
.seg button.on{display:inline-flex;align-items:center;gap:6px}
.seg.segm{gap:0;display:inline-flex;border:1px solid var(--m-outline);border-radius:20px;padding:0;margin-bottom:12px;overflow:hidden}
.seg.segm button{height:40px;min-width:72px;border:0;border-radius:0;border-right:1px solid var(--m-outline);justify-content:center}
.seg.segm button:last-child{border-right:0}
/* assist chips */
.chip{position:relative;overflow:hidden;display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--m-outline-v);background:transparent;color:var(--m-on-sv);font:500 13px/1 var(--font)}
/* badge (NEW) like a launcher badge */
.m3b{position:absolute;top:-2px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--m-badge);color:var(--m-on-badge);font:500 11px/16px var(--font);text-align:center;letter-spacing:.3px}
.tile{position:relative}
/* bottom sheet + drag handle, list items */
#sheet{background:var(--m-s-low);color:var(--m-on-surface);border-radius:28px 28px 0 0}
#sheet::before{content:"";display:block;width:32px;height:4px;border-radius:2px;background:var(--m-on-sv);opacity:.4;margin:16px auto 0}
.sheet-h{padding:8px 12px 8px 24px}
.sheet-h h2{font:400 22px/28px var(--font);color:var(--m-on-surface)}
.sheet-h .w{font:500 14px var(--font);color:var(--m-on-sv)}
.it{background:var(--m-s);border:0;border-radius:16px;min-height:72px}
.it .t b{font:500 16px/24px var(--font)}.it .t .m{font-size:13px;color:var(--m-on-sv)}
.h3{font:500 14px/20px var(--font);color:var(--m-primary);margin:20px 4px 8px}
.note{color:var(--m-on-sv)}
.tier{color:var(--m-primary);font-weight:500}
.prog{background:var(--m-s-highest)}.prog i{background:var(--m-primary)}
.bar{background:var(--m-s-highest)}.bar i{background:var(--m-primary)}
/* dialog */
#cf{background:rgba(0,0,0,.32)}
#cf .box{background:var(--m-s-high);border:0;border-radius:28px;padding:24px;text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#cf h3{font:400 24px/32px var(--font);margin:0 0 16px;color:var(--m-on-surface)}
#cf .what{font:400 14px/20px var(--font);color:var(--m-on-sv);margin:0 0 4px}
#cf .price{font:500 22px/28px var(--font);color:var(--m-on-surface);margin:0 0 24px}
#cf .row{justify-content:flex-end;gap:8px}
#cf .row button{flex:none;min-width:64px;height:40px;padding:0 12px;border-radius:20px;background:transparent;color:var(--m-primary);font:500 14px var(--font);border:0}
#cf .row button#cf-ok{background:var(--m-primary);color:var(--m-on-primary);padding:0 24px}
/* switch */
.sw{position:relative;flex:none;width:52px;height:32px;border-radius:16px;border:2px solid var(--m-outline);background:var(--m-s-highest);cursor:pointer;transition:.2s}
.sw::after{content:"";position:absolute;top:6px;left:6px;width:16px;height:16px;border-radius:50%;background:var(--m-outline);transition:.2s}
.sw.on{background:var(--m-primary);border-color:var(--m-primary)}
.sw.on::after{left:22px;top:2px;width:24px;height:24px;background:var(--m-on-primary)}
input[type=range]{accent-color:var(--m-primary)}
.row2{min-height:48px}.row2 label{font:400 14px var(--font);color:var(--m-on-surface);flex:1;width:auto}

/* ==== Design system v2 — high-end Android glass. Item art and the ad mark are the only images; every surface,
   badge and promo tag below is drawn here so it follows the system theme and scales to any phone. ==== */
:root{--g-bg:color-mix(in srgb,var(--m-s-low) 72%,transparent);--g-card:color-mix(in srgb,var(--m-s-high) 55%,transparent);
 --g-line:color-mix(in srgb,var(--m-on-surface) 12%,transparent);--g-hi:color-mix(in srgb,#fff 10%,transparent);
 --ease-in:cubic-bezier(.3,0,.8,.15);--ease-out:cubic-bezier(.05,.7,.1,1);--ease-std:cubic-bezier(.2,0,0,1);

    <div id="rank-last" class="rank"></div><div class="h3">${$t('rank_week')} <span class="note">${$t('rank_resets')}</span></div><div id="rank-list" class="rank"><div class="note">${$t('loading')}</div></div>`;
  const go = $('chal-go'); if (go) go.onclick = startChallenge;
  loadRank();
}
// ---- weekly ranking of the daily challenge (same board for everyone, so one global list per ISO week) ----
function rankBoard(d = new Date()) {
  const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())), day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y = t.getUTCFullYear(), w = Math.ceil(((t - Date.UTC(y, 0, 1)) / 864e5 + 1) / 7); return `${y}-W${String(w).padStart(2, '0')}-L0`;
}
const rankAsk = (fn, ...a) => new Promise(res => { const id = 'k' + (++waitN); waits[id] = res; window.Game[fn](id, ...a); });
async function loadRank() {
  const el = $('rank-list'); if (!el) return;
  let r;
  if (window.Game && window.Game.rankTop) { const o = await rankAsk('rankTop', rankBoard()); r = o.ok ? o.info : null; }
  else r = { signedIn: false, top: [['M**', '412M'], ['J***', '388M'], ['H**', '301M'], ['#a1f2', '220M'], ['S***', '97.1M']].map(([name, score]) => ({ name, score })) };  // browser preview
  if (!$('rank-list')) return;
  if (!r) { el.innerHTML = `<div class="note">${$t('rank_offline')}</div>`; return; }
  const rows = r.top.map((x, i) => `<div class="rk ${x.me ? 'me' : ''}"><b>${i + 1}</b><span>${x.name}${x.me ? ` <em>${$t('rank_me')}</em>` : ''}</span><span class="t-gold">${x.score} P</span></div>`).join('') || `<div class="note">${$t('rank_empty')}</div>`;
  const mine = r.mine && !r.top.some(x => x.me) ? `<div class="rk me"><b>${r.mine.rank}</b><span>${$t('rank_me')}</span><span class="t-gold">${r.mine.score} P</span></div>` : '';
  const guest = r.signedIn ? '' : `<button class="btn tonal big" id="rank-in" style="margin-top:8px">${$t('rank_sign_in')}</button>`;
  el.innerHTML = rows + mine + guest;
  if (r.signedIn || !window.Game) loadLastWeek();
  const g = $('rank-in'); if (g) g.onclick = () => openSheet('settings');
}
// last week's settled result (server settles Monday 00:10 KST); shown once settled
const RANK_TIER = { first: 'rank_tier_first', top10: 'rank_tier_top10', top100: 'rank_tier_top100', joined: 'rank_tier_joined' };
async function loadLastWeek() {
  const o = window.Game ? (window.Game.rankResult ? await rankAsk('rankResult', rankBoard(new Date(Date.now() - 7 * 864e5))) : {}) : { ok: true, info: { rank: 7, tier: 'top10', of: 214 } }, el = $('rank-last');  // browser preview
  if (!el || !o.ok || !o.info || !o.info.rank) return;
  const k = RANK_TIER[o.info.tier];
  el.innerHTML = `<div class="rk last"><b>${o.info.rank}</b><span>${$t('rank_last_week', o.info.of)}${k ? ` <em>${$t(k)}</em>` : ''}</span></div>`;
}
async function submitRank(o) {
  if (!(window.Game && window.Game.rankSubmit) || !acctInfo().signedIn) return;
  const lg = L(o.score); if (!(lg > -Infinity)) return;
  const r = await rankAsk('rankSubmit', rankBoard(), lg, o.scoreShort); if (r.ok && o.newBest) toast($t('rank_posted'), 'ok');
}
async function startChallenge() {
  const o = await api('challengeStart');
  if (!o.ok) { toast(o.reason === 'keys' ? $t('no_keys_left_today') : $t('challenge_already_running'), 'err'); return; }
  closeAll(); chal = { ends: Date.now() + 60000, auto: autoOn }; autoOn = false;
  applyState(o.state); wallet.v = wallet.to = wallet.shown = L(o.state.wallet); wallet.unit = splitL(wallet.v).unit; reconcile(o.state);
  $('chud').classList.add('on'); phone('ui.levelup', .4);
  chal.timer = setInterval(() => { const left = Math.max(0, chal.ends - Date.now()); $('chud-t').textContent = `0:${String(Math.ceil(left / 1000)).padStart(2, '0')}`; $('chud').classList.toggle('hurry', left < 10000);
    $('chud-s').textContent = '+' + fmtL(wallet.v) + ' P'; if (!left) endChallenge(); }, 200);
}
async function endChallenge() {
  if (!chal) return; clearInterval(chal.timer); autoOn = chal.auto; chal = null; $('chud').classList.remove('on');
  const o = await api('challengeEnd'); if (!o.ok) return;
  track('challenge_end', { score: o.scoreShort, new_best: !!o.newBest });
  submitRank(o);
  applyState(o.state); wallet.v = wallet.to = wallet.shown = L(o.state.wallet); wallet.unit = splitL(wallet.v).unit; reconcile(o.state);
  const el = $('chres');
  el.innerHTML = `<div class="card"><span class="l">${$t('daily_challenge_over')}</span><div class="amt"><span class="v t-gold" id="chres-v">0</span><span class="u">P</span></div>
    ${o.newBest ? `<div class="nb fx-shine">${$t('new_best_2')}</div>` : `<div class="note fit1">${$t('my_best_p', o.bestShort)}</div>`}
    <div class="got"><span class="cap on">${PIECE} ×${o.piecesGot}</span><span class="cap">${$t('pieces_10', o.pieces)}</span></div>
    <button class="btn big skin gold" id="chres-ok">${$t('ok')}</button></div>`;
  el.classList.add('on'); fitLines(el); sfx.badge(); phone('ui.bonus', .5);
  const to = L(o.score), t0 = performance.now(), v = $('chres-v');
  (function tick() { const k = Math.min(1, (performance.now() - t0) / 1200), e = 1 - Math.pow(1 - k, 3); v.textContent = k < 1 ? fmtL(lerpL(-1, to, e)) : o.scoreShort; if (k < 1) requestAnimationFrame(tick); })();
  $('chres-ok').onclick = () => el.classList.remove('on');
}

// ---------- first-run flow: swipe → burst → pull the shade → app shop → first buy (bible 16 #1, #2, #7) ----------
const FT = { step: +(localStorage.getItem('ftue') || 0) };  // 0 = not started, 9 = done
let heldOffline = null;
const ftSave = n => { FT.step = n; localStorage.setItem('ftue', n); track('ftue_step', { step: n }); };
const ftOff = () => $('coach').classList.remove('on');
const ftEnd = () => { const was = FT.step; ftSave(9); ftOff(); autoOn = !/[?&]auto=0/.test(location.search); if (was < 9 && started) afterGuide(); };
// the guide owns the screen: a blocked action re-shows what to do now
function ftNudge() { sfx.snap(); toast(FT.step <= 2 ? $t('ft_nudge_swipe') : FT.step < 6 ? $t('ft_nudge_shop') : $t('ft_auto_title'), 'info'); }
// first screen of the guide: what the game is, in one card
function ftIntro() {
  return new Promise(res => {
    $('cf-t').textContent = $t('ft_intro_title');
    $('cf-w').innerHTML = `${TITLE_ART.has('mascot') ? '<img src="img/title/mascot.webp" alt="" style="width:96px;height:96px;object-fit:contain;display:block;margin:0 auto 8px">' : ''}${$t('ft_intro_body')}`;
    $('cf-p').innerHTML = ''; $('cf-ok').textContent = $t('ft_intro_ok'); $('cf-no').style.display = 'none'; $('cf-ico').innerHTML = ''; $('cf').classList.add('on');
    $('cf-ok').onclick = () => { $('cf').classList.remove('on'); $('cf-no').style.display = ''; $('cf-ok').onclick = null; res(); };
  });
}
const rowRect = id => { const r = byId(id); return r ? { canvas: 1, x: CX0, y: r.y.t, w: CW, h: CH } : null; };
async function ftHintRect() { const h = await api('hint'); return rowRect(h.id) || rowRect(board[Math.min(2, board.length - 1)].id); }
async function ftue(ev, arg) {
  if (FT.step >= 9) return;
  if (ev === 'boot' && FT.step <= 1) { if (FT.step === 0) await ftIntro(); ftSave(1); coach({ rect: await ftHintRect(), text: $t('swipe_to_clear'), sub: $t('follow_the_finger_swipe_sideways'), finger: 'swipe', step: '1 / 6' }); }
  else if (ev === 'swipe' && FT.step === 1) { ftOff(); if ((arg.beats || []).some(b => b.t === 'burst')) { ftSave(2); setTimeout(() => ftue('burst'), 1400); } else setTimeout(async () => FT.step === 1 && coach({ rect: await ftHintRect(), text: $t('swipe_this_one_to_merge'), sub: $t('same_apps_stick_together'), finger: 'swipe', step: '1 / 6' }), 900); }
  else if (ev === 'burst' && FT.step === 2) { coach({ rect: await ftHintRect(), text: $t('4_of_the_same_app'), sub: $t('every_pop_stacks_p'), finger: 'swipe', step: '2 / 6' }); }
  else if (ev === 'swipe' && FT.step === 2) { ftOff(); ftSave(3); }
  else if (ev === 'swipe' && FT.step === 3) {
    const pn = await api('panel'), can = pn.apps.some(a => !a.owned && a.open && (a.canBuy != null ? a.canBuy : geq(pn.state.wallet, a.price)));
    if (can) { ftSave(4); setTimeout(() => coach({ rect: { x: 4, y: 4, w: innerWidth - 8, h: 64 }, text: $t('pull_down_to_open_the'), sub: $t('buy_new_apps_to_grow'), finger: 'pull', step: '3 / 6' }), 1200); }
  }
  else if (ev === 'shade' && FT.step === 4) { ftOff(); const t = shadeEl.querySelector('.tile[data-k="shop"]'); if (t) { const r = t.getBoundingClientRect(); coach({ rect: { x: r.x, y: r.y, w: r.width, h: r.height }, text: $t('tap_the_app_store'), finger: 'tap', step: '3 / 6' }); } }
  else if (ev === 'sheet' && arg === 'shop' && FT.step === 4) {
    ftOff(); ftSave(5);
    setTimeout(() => { const btn = $('sheet-b').querySelector('[data-act="buy"]:not([disabled])'), row = btn && btn.closest('.it'); if (!row) return; row.scrollIntoView({ block: 'center' });
      setTimeout(() => { const r = row.getBoundingClientRect(), a = P.apps.find(x => x.id === btn.dataset.id); coach({ rect: { x: r.x, y: r.y, w: r.width, h: r.height }, text: $t('buy_your_first_app'), sub: a ? `${a.name} · ${(TEXTS[a.id] || [[]])[0][1] || ''}` : '', finger: 'tap', step: '5 / 6', place: r.y > innerHeight * .55 ? 'above' : 'below' }); }, 350); }, 600);
  }
  else if (ev === 'buy' && FT.step === 5) {
    ftSave(6); toast($t('nice_now_upgrade_to_raise'), 'ok');
    setTimeout(() => { closeAll(); const i = TILES.findIndex(t => t.key === 'auto'); setTimeout(() => coach({ rect: { canvas: 1, x: tileX(i) - 30, y: TILEY - 30, w: 60, h: 60 }, text: $t('ft_auto_title'), sub: $t('ft_auto_sub'), finger: 'tap', step: '6 / 6' }), 450); }, 1400);
  }
  else if (ev === 'auto' && FT.step === 6) { ftEnd(); setTimeout(() => toast($t('ft_done'), 'ok'), 300); }
  else if (ev === 'closed' && FT.step === 5) ftOff();
}

// back from away: the app paid the time away (AwayClock) and hands the result here
window.onOffline = o => {
  track('offline_return', { away_min: Math.round((o.awayMs || 0) / 60000), paid: o.paidShort || '0' });
  if (!started || FT.step < 9) { heldOffline = o; return; }  // shown after the title and the guide
  if (L(o.paid) > -Infinity) { addWallet(L(o.paid)); showReturn(o); phone('ui.bonus', .4); }
  applyState(o.state); reconcile(o.state);
};
document.addEventListener('visibilitychange', () => { if (!document.hidden) api('snapshot').then(st => { applyState(st); reconcile(st); }); });
}
</script>
